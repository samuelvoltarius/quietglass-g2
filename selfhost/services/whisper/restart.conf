# Drop-in: ~/.config/systemd/user/whisper-unified.service.d/restart.conf
# Keeps retrying forever (a start can fail while the GPU memory is still busy).
# The ExecStartPre line is ONLY for unified-memory GPUs (GB10, Jetson); delete it on a normal GPU.
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/bin/python3 %h/quietglass-g2/selfhost/services/whisper/free-cache.py
Restart=always
RestartSec=15
