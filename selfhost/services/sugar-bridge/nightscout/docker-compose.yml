# Nightscout + CareLink-Bruecke (Beispiel). Nur 127.0.0.1, Freigabe ins Tailnet nur ueber sugar-bridge.
# Geheimnisse: .env (API_SECRET, Lese-Token) und carelink.env (CareLink-Login) - beide chmod 600.
name: nightscout
services:
  mongo:
    image: mongo:7.0
    container_name: nightscout-mongo
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25", "--quiet"]
    volumes:
      - ./mongo-data:/data/db
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  nightscout:
    image: nightscout/cgm-remote-monitor:15.0.8
    container_name: nightscout
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    ports:
      - "127.0.0.1:8463:1337"
    environment:
      MONGO_CONNECTION: mongodb://mongo:27017/nightscout
      API_SECRET: ${API_SECRET:?API_SECRET fehlt in .env}
      INSECURE_USE_HTTP: "true"
      SECURE_HSTS_HEADER: "false"
      AUTH_DEFAULT_ROLES: denied
      DISPLAY_UNITS: mg/dl
      TZ: Europe/Vienna
      LANGUAGE: de
      TIME_FORMAT: "24"
      BG_HIGH: "250"
      BG_TARGET_TOP: "180"
      BG_TARGET_BOTTOM: "70"
      BG_LOW: "54"
      SHOW_RAWBG: never
      DEVICESTATUS_ADVANCED: "true"
      ENABLE: careportal basal iob cob bwp cage sage iage bage pump devicestatus
      PUMP_FIELDS: reservoir battery clock
      CUSTOM_TITLE: Nightscout
    mem_limit: 512m
    cpus: 1.0
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  carelink:
    build: ./carelink
    image: local/carelink-bridge:5e514f0
    container_name: nightscout-carelink
    # Kein Neustart-Karussell: der Waechter (guard.sh) pausiert bei Platzhaltern oder fehlendem Login
    # und loggt sich NIE selbst mit dem Passwort ein (Medtronic sperrt Konten nach Fehlversuchen).
    restart: unless-stopped
    depends_on: [nightscout]
    env_file: [./carelink.env]
    environment:
      API_SECRET: ${API_SECRET:?API_SECRET fehlt in .env}
      NS: http://nightscout:1337
      CARELINK_LOGINDATA: /data/logindata.json
      CARELINK_STATE_FILE: /data/state.json
      CARELINK_METRICS_PORT: "0"
    volumes:
      - ./carelink-data:/data
    healthcheck: { disable: true }
    mem_limit: 256m
    cpus: 0.5
    logging: { driver: json-file, options: { max-size: "5m", max-file: "3" } }

networks:
  default:
    # Eigenes Netz: 192.168.0.0/24 kommt per Tailscale-Subnetzroute (table 52) und wuerde den Port verschlucken.
    ipam:
      config:
        - subnet: 192.168.208.0/24
