<html lang="en">

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shoot Day · web terminal</title>
<style>

  header h1 { font-size:16px; margin:0; letter-spacing:.5px; }
  .pill { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--dim); font-size:12px; }
  .pill b { color:var(--fg); font-weight:600; }
  .layout { display:grid; grid-template-columns:290px 1fr; min-height:calc(100vh - 50px); }
  @media (max-width:860px) { .layout { grid-template-columns:1fr; } aside { border-right:none !important; border-bottom:1px solid var(--line); max-height:45vh; } }
  aside { border-right:1px solid var(--line); padding:12px; display:flex; flex-direction:column; gap:8px; overflow:auto; }
  main { padding:16px 20px; overflow:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:0 0 10px; }
  input, select, button, textarea { font:inherit; }
  input, select, textarea { background:var(--bg); border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:7px 9px; }
  textarea { width:100%; min-height:90px; resize:vertical; line-height:1.6; }
  button { background:var(--acc); color:#04110a; border:none; border-radius:8px; padding:8px 12px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:500; }
  button.danger { background:transparent; color:var(--ng); border:1px solid #5a2a26; font-weight:500; }
  button.sm { padding:4px 8px; font-size:12px; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; min-width:120px; }
  .muted { color:var(--dim); } .ok { color:var(--acc); } .bad { color:var(--ng); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; }
  th { color:var(--dim); font-weight:600; }
  td input, td textarea { width:100%; }
  td textarea { min-height:54px; }
  .clist { display:flex; flex-direction:column; gap:2px; }
  .citem { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:7px 9px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .citem:hover { background:var(--panel); }
  .citem.on { background:var(--panel2); border-color:var(--line); }
  .citem small { display:block; color:var(--dim); font-size:12px; }
  .badge { background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:0 7px; font-size:11px; color:var(--dim); white-space:nowrap; }
  .badge.acc { color:var(--acc); border-color:#1e5a3b; }
  .crumbs { color:var(--dim); margin-bottom:8px; }
  .crumbs a { color:var(--dim); cursor:pointer; text-decoration:underline; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin:12px 0 14px; }
  .tabs button { background:transparent; color:var(--dim); border:none; border-bottom:2px solid transparent; border-radius:0; padding:8px 12px; font-weight:500; }
  .tabs button.on { color:var(--fg); border-bottom-color:var(--acc); }
  .plist { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  .pcard { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; }
  .pcard:hover { border-color:var(--acc); }
  .pcard b { display:block; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--dim); }
  .drop.over { border-color:var(--acc); color:var(--fg); }
  .scene { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; }
  .scene-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .banner { border:1px solid var(--line); border-left:4px solid var(--warn); background:var(--panel2); border-radius:8px; padding:8px 12px; margin-bottom:10px; }
  label.field { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--dim); }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
  #auth { display:none; } #auth.show { display:block; }
  details summary { cursor:pointer; color:var(--dim); }
  #everywhere { display:none; flex-direction:column; gap:6px; } #everywhere.show { display:flex; }
  .hit { padding:6px 8px; border-radius:8px; cursor:pointer; border:1px solid var(--line); background:var(--panel); }
  .hit:hover { border-color:var(--acc); }
  .hit small { display:block; color:var(--dim); font-size:11px; }
  .hit span { display:block; font-size:12px; color:var(--dim); overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  pre { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; max-height:260px; overflow:auto; font-size:12px; }
</style>

// ---------------------------------------------------------------------------
// Helpers. Everything from the server or typed by people is set as text or as
// a property — never as HTML — so a note like <img onerror=…> stays a note.
// ---------------------------------------------------------------------------
const $ = (selector) => document.querySelector(selector);
function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === undefined || value === null) continue;
    if (key === "class") el.className = value;
    else if (key === "style") el.style.cssText = value;
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else el[key] = value;
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) el.append(child instanceof Node ? child : String(child));
  return el;
}
let flashTimer;
const flash = (text) => { $("#flash").textContent = text; clearTimeout(flashTimer); flashTimer = setTimeout(() => { $("#flash").textContent = ""; }, 3500); };
const field = (label, input) => h("label", { class: "field" }, label, input);
/** Seconds → "m:ss" for the time fields (the server reads "m:ss" and plain seconds alike). */
const secs = (value) => {
  if (value === null || value === undefined || value === "") return "";
  const n = Number(value);
  if (!Number.isFinite(n)) return String(value);
  const whole = Math.floor(n);
  return Math.floor(whole / 60) + ":" + String(whole % 60).padStart(2, "0");
};
const day = (ts) => (ts ? new Date(ts).toLocaleDateString(LANG, { day: "2-digit", month: "2-digit", year: "numeric" }) : "");

const TOKEN_KEY = "shootday.token";
const token = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } };
async function request(path, options = {}) {
  const headers = { ...(options.json !== undefined ? { "Content-Type": "application/json" } : {}), ...(options.headers || {}) };
  if (token()) headers.Authorization = "Bearer " + token();
  const response = await fetch(path, {
    method: options.method || (options.json !== undefined || options.body ? "POST" : "GET"),
    headers, body: options.json !== undefined ? JSON.stringify(options.json) : options.body,
    signal: AbortSignal.timeout(options.timeout || 15000),
  });
  if (response.status === 401) { $("#auth").classList.add("show"); throw new Error("unauthorized"); }
  $("#auth").classList.remove("show");
  if (!response.ok) {
    let detail = "HTTP " + response.status;
    try { detail = (await response.json()).error || detail; } catch { /* keep the status */ }
    const error = new Error(detail); error.status = response.status; throw error;
  }
  return options.raw ? response : response.json();
}
const api = (path) => request(path);

  if (String(error?.message) === "unauthorized") return;
  console.error(error);

// ---------------------------------------------------------------------------

const TAB_KEYS = { board: "tabBoard", shots: "tabShots", ideas: "tabIdeas", script: "tabScript", day: "tabDay", pack: "tabPack", files: "tabFiles" };

function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map((x) => { try { return decodeURIComponent(x); } catch { return ""; } });
  if (parts[0] === "c" && parts[1]) return { kind: "customer", id: parts[1] };
  if (parts[0] === "p" && parts[1]) return { kind: "project", id: parts[1], tab: TABS.includes(parts[2]) ? parts[2] : "board" };
  return { kind: "home" };
}
const go = (hash) => { if (location.hash === hash) void render(); else location.hash = hash; };
window.addEventListener("hashchange", () => { void render(); });

async function loadCustomers() {
  const reply = await api("/api/customers");
  customers = reply.customers || [];
  const state = await api("/api/state");
  const owner = customers.find((c) => c.id === reply.activeCustomer);
  $("#activeName").textContent = state.active ? state.active + (owner ? " · " + owner.name : "") : "–";
  renderCustomerList();
}

function renderCustomerList() {

// Search over every customer and project (only when the server has an embedding service).
let searchTimer;
let searchRun = 0;
async function searchAll() {
  const q = $("#searchAll").value.trim();
  const run = ++searchRun;
  if (q.length < 2) { $("#hits").replaceChildren(); return; }
  try {
    const reply = await api("/api/search?q=" + enc(q) + "&limit=8");
    if (run !== searchRun) return;
    const hits = reply.hits || [];
    $("#hits").replaceChildren(...(hits.length ? hits.map((hit) => h("div", { class: "hit", title: String(hit.score), onclick: () => go("#/p/" + enc(hit.projectId)) },
      h("small", {}, [hit.customer, hit.project].filter(Boolean).join(" · ")),
      h("b", {}, hit.title || ""),
      h("span", {}, hit.snippet || ""),
    )) : [h("p", { class: "muted", style: "margin:0" }, T("searchNone"))]));
  } catch (error) {
    if (run !== searchRun || String(error?.message) === "unauthorized") return;
    $("#hits").replaceChildren(h("p", { class: "bad", style: "margin:0" }, T("searchFailed")));
  }
}
$("#searchAll").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { void searchAll(); }, 350); });

/** Reads a stored PDF; the proposal (or the manual-entry fallback) opens as a new, unsaved storyboard. */
async function storyboardFromPdf(file, where) {
  const working = h("div", { class: "banner" }, T("proposalWorking"));
  where.prepend(working);
  try {
    const result = await request(projectPath("/files/" + enc(file.id) + "/storyboard?lang=" + LANG), { method: "POST", timeout: 240000 });
    let banner;
    if (result.encrypted) banner = T("proposalEncrypted");
    else if (!result.extracted) banner = T("proposalNoText");
    else if (result.llm === "off") banner = T("proposalNoLlm");
    else if (result.llm === "failed") banner = T("proposalFailed", { error: result.error || "?" });
    else banner = T("proposalLlm");
    const scenes = result.scenes.length ? result.scenes : [{ n: 1, from: "", to: "", title: "", content: "", camera: "", overlay: "", goal: "", done: false }];
    working.replaceWith(boardEditor({ title: file.name.replace(/\.pdf$/i, ""), source: file.name, scenes }, { banner, text: result.text, fresh: true }));
  } catch (error) {
    working.remove();
    report(error);
  }
}

  });
  body.replaceChildren(
    h("section", { class: "card" },
      h("div", { class: "row" },
        h("button", { class: "ghost", onclick: () => editors.prepend(boardEditor({ title: "", scenes: [] }, { fresh: true })) }, T("boardNew")),
        h("span", { class: "grow" }),
        select,
        h("button", { disabled: pdfs.length === 0, onclick: () => { const f = pdfs.find((x) => x.id === select.value); if (f) void storyboardFromPdf(f, editors); } }, T("boardFromPdf"))),
      h("div", { style: "margin-top:10px" }, drop),
    ),
    editors,

  if (p.storyboards.length === 0) editors.append(h("p", { class: "muted" }, T("boardNone")));

}

async function renderDay(body) {
  const d = currentProject.dispo;
  const schedule = d.schedule.map((r) => ({ ...r }));
  const inputs = {
    date: h("input", { value: d.date || "", placeholder: T("datePlaceholder"), style: "width:180px" }),
    call: h("input", { value: d.call || "", placeholder: T("callPlaceholder"), style: "width:120px" }),
    location: h("input", { value: d.location || "", placeholder: T("locationPlaceholder"), class: "grow" }),
    contact: h("input", { value: d.contact || "", placeholder: T("contactPlaceholder"), class: "grow" }),
    geo: h("input", { value: d.lat !== undefined && d.lon !== undefined ? `${d.lat}, ${d.lon}` : "", placeholder: T("geoPlaceholder"), style: "width:170px" }),
  };
  const rows = h("div");
  const draw = () => {
    rows.replaceChildren(schedule.length ? h("table", {}, h("tbody", {}, schedule.map((row, i) => h("tr", {},
      h("td", { style: "width:110px" }, h("input", { value: row.time || "", oninput: (e) => { row.time = e.target.value; } })),
      h("td", {}, h("input", { value: row.what || "", oninput: (e) => { row.what = e.target.value; } })),
      h("td", { style: "width:36px" }, h("button", { class: "ghost sm", onclick: () => { schedule.splice(i, 1); draw(); } }, "✕")),
    )))) : h("p", { class: "muted" }, T("noRows")));
  };
  draw();
  const time = h("input", { placeholder: T("timePlaceholder"), style: "width:100px" });
  const what = h("input", { placeholder: T("whatPlaceholder"), class: "grow" });
  body.replaceChildren(h("section", { class: "card" },
    h("div", { class: "row", style: "margin-bottom:10px" }, ...Object.values(inputs)),
    rows,
    h("div", { class: "row", style: "margin-top:8px" }, time, what, h("button", { class: "ghost", onclick: () => {
      if (!what.value.trim()) return;
      schedule.push({ time: time.value.trim(), what: what.value.trim() }); time.value = ""; what.value = ""; draw();
    } }, T("addRow"))),
    h("div", { class: "row", style: "margin-top:10px" }, h("button", { onclick: async () => {
      try {
        const [lat, lon] = inputs.geo.value.split(/[,;\s]+/).filter(Boolean);
        await post(pq("/api/dispo"), { date: inputs.date.value, call: inputs.call.value, location: inputs.location.value, contact: inputs.contact.value, notes: d.notes || "", schedule, ...(lat && lon ? { lat, lon } : {}) });
        flash(T("saved"));
      } catch (error) { report(error); }
    } }, T("save")))));
}

// ---- Packing list — every change goes to the server on its own, never the
// whole list, so a tick here cannot overwrite a tick made on the glasses.
async function renderPack(body) {
  let equipment = [];
  const list = h("div");
  const count = h("span", { class: "muted", style: "font-weight:400" });
  const send = async (payload) => {
    try { await post(pq("/api/equipment"), payload); flash(T("saved")); } catch (error) { flash(T("notSaved")); console.error(error); }
  };
  const draw = () => {
    const groups = [...new Set(equipment.map((item) => item.group))];
    list.replaceChildren(...groups.map((group) => h("div", {},
      h("h3", { style: "margin:14px 0 4px;font-size:15px" }, group),
      h("table", {}, h("tbody", {}, equipment.filter((item) => item.group === group).map((item) => h("tr", {},
        h("td", { style: "width:110px" }, h("label", {}, h("input", { type: "checkbox", checked: item.need, onchange: (e) => {
          item.need = e.target.checked; if (!item.need) item.packed = false; draw();
          void send({ setneed: { name: item.name, need: item.need } });
        } }), " " + T("needs"))),
        h("td", { style: "width:130px" }, h("label", { class: item.need ? "" : "muted" }, h("input", { type: "checkbox", checked: item.packed, disabled: !item.need, onchange: (e) => {
          item.packed = e.target.checked; draw();
          void send({ toggle: { name: item.name, packed: item.packed } });
        } }), " " + T("packed"))),
        h("td", { class: item.need ? "" : "muted" }, item.name),
        h("td", { style: "width:40px" }, h("button", { class: "ghost sm", onclick: () => {
          if (!confirm(T("confirmRemove", { name: item.name }))) return;
          equipment = equipment.filter((x) => x !== item); draw();
          void send({ remove: { name: item.name } });
        } }, "✕")),
      )))),
    )));
    const need = equipment.filter((i) => i.need).length;
    const packed = equipment.filter((i) => i.need && i.packed).length;
    count.textContent = need ? T("countSome", { packed, need }) : T("countNone");
  };
  const reload = async () => { equipment = (await api(pq("/api/equipment"))).items || []; draw(); };
  const item = h("input", { placeholder: T("itemPlaceholder"), class: "grow" });
  const group = h("input", { placeholder: T("groupPlaceholder"), style: "width:140px" });
  body.replaceChildren(h("section", { class: "card" },
    h("h2", {}, T("tabPack"), " ", count),
    h("p", { class: "muted", style: "margin-top:0" }, T("packHint")),
    h("div", { class: "row", style: "margin-bottom:10px" }, item, group,
      h("button", { class: "ghost", onclick: async () => {
        if (!item.value.trim()) return;
        await send({ add: { group: group.value.trim() || "Other", name: item.value.trim(), need: true } });
        item.value = ""; await reload().catch(report);
      } }, T("addItem")),
      h("button", { class: "ghost sm", onclick: async () => { for (const i of equipment.filter((x) => x.need)) await send({ setneed: { name: i.name, need: false } }); await reload().catch(report); } }, T("clearNeed")),
      h("button", { class: "ghost sm", onclick: async () => { for (const i of equipment.filter((x) => x.packed)) await send({ toggle: { name: i.name, packed: false } }); await reload().catch(report); } }, T("clearPacked"))),
    list));
  await reload();
  // Pick up ticks made on the glasses — unless someone is typing here.
  poll(() => document.body.contains(list) && document.activeElement?.tagName !== "INPUT", reload, 10000);
}

// ---- Files ----------------------------------------------------------------
function dropZone(onFiles) {
  const input = h("input", { type: "file", multiple: true, accept: ".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg", style: "display:none", onchange: () => { void onFiles([...input.files]); input.value = ""; } });
  const zone = h("div", { class: "drop" }, T("dropHere", { mb: config.maxUploadMb }), " ", h("button", { class: "ghost sm", onclick: () => input.click() }, T("choose")), input);
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", (e) => { e.preventDefault(); zone.classList.remove("over"); void onFiles([...(e.dataTransfer?.files || [])]); });
  return zone;
}

/** Uploads one file after the other; returns what the server stored. */
async function upload(files) {
  const stored = [];
  for (const file of files) {
    if (!/\.(pdf|png|jpe?g)$/i.test(file.name)) { alert(T("wrongType", { name: file.name })); continue; }
    if (file.size > config.maxUploadMb * 1024 * 1024) { alert(T("tooLarge", { name: file.name, mb: config.maxUploadMb })); continue; }
    flash(T("uploading", { name: file.name }));
    try {
      stored.push(await request(projectPath("/files"), {
        method: "POST", body: file, headers: { "Content-Type": "application/octet-stream", "X-File-Name": enc(file.name) }, timeout: 120000,
      }));
      flash(T("saved"));
    } catch (error) { report(error); }
  }
  currentProject.files.push(...stored);
  return stored;
}

/** Fetched with the token, then shown from a local blob: no token ever goes into a URL. */
async function openFile(file) {
  try {
    const response = await request(projectPath("/files/" + enc(file.id)), { raw: true, timeout: 60000 });
    const url = URL.createObjectURL(await response.blob());
    const link = h("a", { href: url, target: "_blank", rel: "noopener" });
    if (file.type !== "pdf") link.download = file.name;
    document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (error) { report(error); }
}

async function renderFiles(body) {
  const list = h("tbody");
  const draw = () => {
    const files = currentProject.files;
    list.replaceChildren(...(files.length ? files.map((f) => h("tr", {},
      h("td", {}, f.name), h("td", { class: "muted" }, f.type.toUpperCase()), h("td", { class: "muted" }, bytes(f.size)), h("td", { class: "muted" }, day(f.uploaded)),
      h("td", { style: "white-space:nowrap;text-align:right" },
        h("button", { class: "ghost sm", onclick: () => { void openFile(f); } }, T("open")), " ",
        f.type === "pdf" ? h("button", { class: "ghost sm", onclick: () => { pendingPdf = f.id; go("#/p/" + currentProject.id + "/board"); } }, T("boardFromPdf")) : null, " ",
        h("button", { class: "danger sm", onclick: async () => {
          if (!confirm(T("confirmDeleteFile", { name: f.name }))) return;
          try {
            await del(projectPath("/files/" + enc(f.id)));
            currentProject.files = currentProject.files.filter((x) => x.id !== f.id); draw();
          } catch (error) { report(error); }
        } }, "✕")),
    )) : [h("tr", {}, h("td", { colSpan: 5, class: "muted" }, T("noFiles")))]));
  };
  draw();
  // paperwork drafts from templates (drone flight, location permit, consent) – written on the server as PDF
  const pick = h("select", {}, h("option", { value: "" }, T("draftPick")));
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const date = h("input", { type: "date", value: today, title: T("draftDate"), ariaLabel: T("draftDate") });
  const make = h("button", { class: "sm" }, T("draftMake"));
  const note = h("span", { class: "muted" });
  const drafts = h("div", { style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px" }, pick, date, make, note);
  api(projectPath("/docs")).then((info) => {
    for (const t of info.templates) pick.append(h("option", { value: t.id }, t.label));
    if (!info.pdf) { make.disabled = true; note.textContent = T("draftOff"); }
  }).catch(() => { drafts.hidden = true; });
  make.onclick = async () => {
    if (!pick.value) return;
    make.disabled = true; note.textContent = T("draftBusy");
    try {
      const made = await request(projectPath("/docs"), { json: { template: pick.value, date: date.value }, timeout: 180000 });
      currentProject.files = [...currentProject.files, ...made.files]; draw();
      note.textContent = "";
    } catch (error) { note.textContent = ""; report(error); } finally { make.disabled = false; }
  };
  body.replaceChildren(h("section", { class: "card" },
    dropZone(async (files) => { await upload(files); draw(); }),
    drafts,
    h("table", { style: "margin-top:12px" }, list)));
}

const TAB_RENDER = { board: renderBoard, shots: renderShots, ideas: renderIdeas, script: renderScript, day: renderDay, pack: renderPack, files: renderFiles };

// ---------------------------------------------------------------------------
/** One timer per page view; it does nothing once its view is gone. */
let pollTimer;
function poll(wanted, task, ms) {
  clearInterval(pollTimer);
  let busy = false;
  pollTimer = setInterval(async () => {
    if (busy || document.hidden || !wanted()) return;
    busy = true;
    try { await task(); } catch { /* next round */ } finally { busy = false; }
  }, ms);
}

async function render() {
  clearInterval(pollTimer);
  route = parseRoute();
  try {
    if (location.hash === "#/new") { route = { kind: "new" }; renderNewCustomer(); return; }
    if (route.kind === "customer") { currentProject = null; renderCustomerList(); await renderCustomer(route.id); }
    else if (route.kind === "project") await renderProject(route.id, route.tab);
    else { currentProject = null; renderCustomerList(); $("#main").replaceChildren(h("section", { class: "card" }, h("p", { style: "margin:0" }, T("welcome")))); }
  } catch (error) {
    if (error?.status === 404) { go("#/"); return; }
    report(error);
  }
}

async function start() {
  try {
    config = { ...config, ...(await api("/api/config")) };
    $("#everywhere").classList.toggle("show", Boolean(config.embed));
    await loadCustomers();
    await render();
  } catch (error) { report(error); }
}
void start();
</script>
